[project]
# Not a distributable package -- this exists so the shared tools in utils/ and
# their test suite run against pinned dependencies instead of whatever the
# machine happens to have. Byte-identity against the committed font artifacts
# is this project's acceptance check, and PNG bytes are encoder-dependent, so
# an unpinned Pillow would make "the file changed" and "my encoder differs"
# indistinguishable. Version floor matches the python in .tool-versions.
name = "core-keeper"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pillow==12.1.1",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # Pinned here so the linter the pre-commit hook runs and the one a shell
    # runs are the same binary. They were not: the hook pulled v0.16.0 from
    # ruff-pre-commit while `uv run ruff` resolved 0.16.4, and ruff's DEFAULT
    # rule set has widened between releases -- 415 rules of 1063 in 0.16.4,
    # against the E4/E7/E9/F the documentation still describes. Without an
    # explicit selection below, an upgrade would silently change what the gate
    # enforces.
    "ruff>=0.16.4",
]

# Adopted verbatim from work/selgros/salesbuddy/shared, which is the oldest and
# largest Python project here (first commit 2025-04-30, against this repo's
# 2026-05-15) and the one whose selection is deliberate and commented. This repo
# simply never received it: it was started after that standard existed and grew
# for four months with no linter running at all.
[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# Community standard rule selection - focused on essential code quality
select = [
    # Core Python rules
    "F",      # Pyflakes - essential error detection
    "E",      # pycodestyle errors - PEP 8 compliance
    "W",      # pycodestyle warnings - PEP 8 compliance

    # Import and code organization
    "I",      # isort - import sorting
    "UP",     # pyupgrade - modern Python syntax

    # Code quality and bug prevention
    "B",      # flake8-bugbear - common bugs and design problems
    "C4",     # flake8-comprehensions - better list/dict comprehensions
    "SIM",    # flake8-simplify - code simplification suggestions

    # Best practices
    "N",      # pep8-naming - naming conventions
    "RUF",    # Ruff-specific rules - modern Python patterns

    # Security and async (when relevant)
    "S",      # flake8-bandit - security issues
    "ASYNC",  # flake8-async - async/await best practices

    # Docstring linting - comprehensive pydocstyle rules
    "D",      # pydocstyle - docstring conventions (D1xx-D4xx)
]

ignore = [
    # Security rules that are too strict for development
    "S101",    # Use of assert detected (common in tests and development)

    # Naming rules that conflict with common patterns
    "N806",    # Variable in function should be lowercase (conflicts with dataclasses)

    # Docstring rules - allow some flexibility while maintaining quality
    "D104",    # Missing docstring in public package (allow empty __init__.py files)

    # Security rules that do not apply to a local toolbox, added beyond
    # salesbuddy's list because this repo's tools exist to drive other programs
    # and to speak protocols whose hash formats are not ours to choose. Each
    # was checked against its actual call sites before being disabled:
    "S603",    # subprocess call - every one here passes a LIST, never a shell
               # string, and `shell=True` appears nowhere. S603 fires on the
               # call regardless of form, so it flags the pattern that is
               # already the safe one.
    "S607",    # partial executable path - `git`, `curl`, `dotnet` and `unity`
               # are meant to come from PATH. Hardcoding absolute paths would
               # break on every machine but the one they were written on.
    "S324",    # insecure hash - md5 verifies a download against the checksum
               # mod.io publishes, and sha1/md5 derive Unity GUIDs. Both
               # formats are dictated by the system on the other end; neither
               # is a security decision this code gets to make.
    "S311",    # non-cryptographic random - used for test fixtures and jitter,
               # never for anything an attacker would care about.
]

# Allow fix for all enabled rules (when `--fix`) is provided
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Tests have different requirements
"utils/tests/**/*.py" = [
    "S101",     # Use of assert detected - essential for tests
    "S106",     # Possible hardcoded password - test data is fine
]

# Allow empty __init__.py files without docstrings
"**/__init__.py" = [
    "D100",     # Missing docstring in public module
    "D104",     # Missing docstring in public package
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.pydocstyle]
# Use Google docstring convention
convention = "google"

[tool.ruff.format]
# Black-compatible formatting
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
