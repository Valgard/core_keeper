repos:
    # `rev` is a second version source beside uv.lock, and the two drift apart
    # on their own: ruff's DEFAULT rule set widens between releases, so a gap
    # here means the gate enforces something other than what `uv run ruff`
    # reports. Keep this tag in step with the version `uv run ruff --version`
    # prints whenever either side moves.
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.16.8
      hooks:
          # No `--fix`: the gate blocks and the author reruns `ruff check --fix`,
          # the same contract csharpier and ruff-format follow below.
          - id: ruff-check
            stages:
                - pre-commit
                - pre-push

          - id: ruff-format
            args: [--check, --exit-non-zero-on-fix]
            stages:
                - pre-commit
                - pre-push

    - repo: local
      hooks:
          - id: csharpier
            name: csharpier
            entry: dotnet csharpier check
            language: system
            files: \.cs$
            stages:
                - pre-commit
                - pre-push

          # Scope is `git ls-files`, not a directory walk: the SDK clone and
          # every mod repo sit inside this one as separate repositories.
          - id: docs-links
            name: docs links
            entry: uv run --frozen utils/check_docs_links.py
            language: system
            pass_filenames: false
            files: \.md$
            stages:
                - pre-commit
                - pre-push

          # Editing prose by pattern lengthens a line without rewrapping the
          # paragraph — invisible to the link check and to any formatter.
          - id: docs-wrapping
            name: docs wrapping
            entry: uv run --frozen utils/check_docs_wrapping.py
            language: system
            pass_filenames: false
            files: \.md$
            stages:
                - pre-commit
                - pre-push

          # A line reference that drops its assembly — `:419767`, inherited from
          # an earlier sentence — reads better and is invisible to every check,
          # so a game update invalidates it in silence. 288 of the handbook's
          # references were written that way before this gate existed.
          - id: citation-style
            name: citation style
            entry: uv run --frozen utils/check_citation_style.py
            language: system
            pass_filenames: false
            files: \.md$
            stages:
                - pre-commit
                - pre-push

          # Runs through uv so the suite sees the pinned Pillow, not whatever
          # the machine has — test_shipped_artifacts.py compares the committed
          # font atlas by byte-identity, which an unpinned encoder would break.
          - id: pytest
            name: pytest (utils)
            entry: uv run --frozen pytest utils/tests -q
            language: system
            pass_filenames: false
            files: ^(utils/|pyproject\.toml|uv\.lock)
            stages:
                - pre-commit
                - pre-push
